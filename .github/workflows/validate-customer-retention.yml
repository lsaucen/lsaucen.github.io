name: Validate Customer Retention Dashboard

on:
  push:
    branches:
      - customer-retention-dashboard
    paths:
      - retail-efferd-src/**
      - .github/workflows/validate-customer-retention.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-retention-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: retail-efferd-src/package-lock.json
      - name: Install dependencies
        working-directory: retail-efferd-src
        run: npm ci
      - name: Typecheck and build
        working-directory: retail-efferd-src
        run: npm run build
