name: Publish Financial Intelligence Preview

on:
  push:
    branches:
      - financial-intelligence-dashboard
    paths:
      - retail-efferd-src/**
      - .github/workflows/publish-financial-intelligence-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Financial Intelligence branch
        uses: actions/checkout@v4
        with:
          ref: financial-intelligence-dashboard
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: retail-efferd-src/package-lock.json

      - name: Install dependencies
        working-directory: retail-efferd-src
        run: npm ci

      - name: Build preview
        working-directory: retail-efferd-src
        run: npm run build -- --base=/financial-intelligence-preview/

      - name: Stage preview
        run: |
          rm -rf /tmp/financial-intelligence-preview
          mkdir -p /tmp/financial-intelligence-preview
          cp -R retail-efferd-src/dist/. /tmp/financial-intelligence-preview/

      - name: Publish preview to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm -rf financial-intelligence-preview
          mkdir -p financial-intelligence-preview
          cp -R /tmp/financial-intelligence-preview/. financial-intelligence-preview/
          git add financial-intelligence-preview
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Publish Financial Intelligence dashboard preview"
            git push origin main
          fi
