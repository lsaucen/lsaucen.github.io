name: Publish Retail Dashboard

on:
  push:
    branches:
      - retail-dashboard
    paths:
      - retail-efferd-src/**
      - .github/workflows/finalize-retail-dashboard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retail source
        uses: actions/checkout@v4
        with:
          ref: retail-dashboard
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: retail-efferd-src/package-lock.json

      - name: Install dependencies
        working-directory: retail-efferd-src
        run: npm ci

      - name: Build dashboard
        working-directory: retail-efferd-src
        run: npm run build -- --base=/retail-performance/

      - name: Stage build
        run: |
          rm -rf /tmp/retail-final
          mkdir -p /tmp/retail-final
          cp -R retail-efferd-src/dist/. /tmp/retail-final/

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          rm -rf retail-performance
          mkdir -p retail-performance
          cp -R /tmp/retail-final/. retail-performance/

          git add retail-performance
          if git diff --cached --quiet; then
            echo "Retail dashboard already current"
          else
            git commit -m "Improve retail dashboard navigation"
            git push origin main
          fi
