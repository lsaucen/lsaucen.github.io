name: Install Efferd Dashboard 1

on:
  push:
    branches:
      - efferd-dashboard-1
    paths:
      - .github/workflows/install-efferd-dashboard-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: efferd-dashboard-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install shadcn skill
        run: npx --yes skills add shadcn/ui --skill shadcn -y

      - name: Scaffold shadcn Vite project
        run: |
          rm -rf retail-efferd-src
          npx --yes shadcn@latest init -t vite -b radix -p nova -n retail-efferd-src -y --no-monorepo

      - name: Add Efferd registry
        working-directory: retail-efferd-src
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'components.json'
          const data = JSON.parse(fs.readFileSync(p, 'utf8'))
          data.registries = data.registries || {}
          data.registries['@efferd'] = 'https://efferd.com/r/{style}/{name}.json'
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n')
          NODE

      - name: Install Efferd dashboard-1
        working-directory: retail-efferd-src
        run: npx --yes shadcn@latest add @efferd/dashboard-1 --yes

      - name: Verify build
        working-directory: retail-efferd-src
        run: npm run build

      - name: Commit installed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents .claude .cursor retail-efferd-src 2>/dev/null || true
          git add retail-efferd-src
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install Efferd dashboard-1 prototype"
            git push origin HEAD:efferd-dashboard-1
          fi
