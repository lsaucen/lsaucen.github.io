<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Nuñez Salcé — Data Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12261E;          /* deep pine ink */
    --paper:#FAFBF8;        /* warm paper */
    --grid:#E4E9E2;         /* cell grid line */
    --excel:#1D6F42;        /* Excel green */
    --excel-soft:#E7F2EB;
    --pbi:#B8860B;          /* Power BI amber, darkened for contrast */
    --pbi-soft:#FBF3DC;
    --sql:#2A5D8F;          /* SQL steel blue */
    --sql-soft:#E8EFF7;
    --py:#6B4FA3;           /* Python violet */
    --py-soft:#EFEAF7;
    --muted:#5C6B62;
    --card:#FFFFFF;
    --focus:#12261E;
    --radius:10px;
    --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
  body{
    font-family:var(--body);color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:56px 32px; /* spreadsheet cell proportions */
    line-height:1.55;
  }
  .wrap{max-width:1020px;margin:0 auto;padding:0 24px}

  /* ===== Formula bar header (signature) ===== */
  .formulabar{
    position:sticky;top:0;z-index:20;background:var(--card);
    border-bottom:1px solid var(--grid);
    box-shadow:0 1px 0 rgba(18,38,30,.04);
  }
  .formulabar .wrap{display:flex;align-items:center;gap:14px;padding:10px 24px}
  .cellref{
    font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--muted);
    border:1px solid var(--grid);border-radius:6px;padding:4px 10px;background:var(--paper);white-space:nowrap
  }
  .fx{font-family:var(--mono);font-size:.82rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .fx .fn{color:var(--excel);font-weight:600}
  .fx .str{color:var(--pbi)}

  /* ===== Hero ===== */
  header.hero{padding:72px 0 44px}
  .eyebrow{font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--excel);margin-bottom:14px}
  h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;max-width:16ch}
  .hero p.lede{margin-top:18px;max-width:56ch;font-size:1.06rem;color:var(--muted)}
  .hero .contact{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
  .contact a,.contact span{
    font-family:var(--mono);font-size:.8rem;text-decoration:none;color:var(--ink);
    border:1px solid var(--grid);background:var(--card);border-radius:999px;padding:7px 14px;
    transition:border-color .15s ease
  }
  .contact a:hover{border-color:var(--excel)}
  .contact a:focus-visible,.tab:focus-visible,.card a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ===== Sheet tabs (filter) ===== */
  nav.sheettabs{margin:8px 0 0;border-bottom:2px solid var(--ink)}
  .sheettabs .wrap{display:flex;gap:4px;align-items:flex-end;padding-bottom:0}
  .tab{
    font-family:var(--mono);font-size:.8rem;font-weight:500;cursor:pointer;
    border:1px solid var(--grid);border-bottom:none;background:var(--paper);color:var(--muted);
    padding:9px 18px 8px;border-radius:8px 8px 0 0;transition:background .15s ease,color .15s ease
  }
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab:hover:not([aria-selected="true"]){background:var(--card);color:var(--ink)}

  /* ===== Projects grid ===== */
  main{padding:40px 0 30px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column
  }
  .card.hidden{display:none}
  .card .media{position:relative;aspect-ratio:16/9;background:var(--paper);border-bottom:1px solid var(--grid)}
  .card .media iframe,.card .media img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
  .media .placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--muted);font-family:var(--mono);font-size:.78rem;text-align:center;padding:16px;
    background:repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(18,38,30,.025) 10px,rgba(18,38,30,.025) 20px)
  }
  .placeholder .icon{font-size:1.6rem;opacity:.5}
  .card .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .toolrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .badge{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:4px 10px}
  .badge.excel{background:var(--excel-soft);color:var(--excel)}
  .badge.pbi{background:var(--pbi-soft);color:var(--pbi)}
  .badge.sql{background:var(--sql-soft);color:var(--sql)}
  .badge.py{background:var(--py-soft);color:var(--py)}
  .org{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .card h3{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
  .card p.desc{font-size:.92rem;color:var(--muted)}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}
  .facts dt{font-family:var(--mono);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
  .facts dd{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .chip{font-family:var(--mono);font-size:.7rem;color:var(--muted);border:1px solid var(--grid);border-radius:999px;padding:3px 10px;background:var(--paper)}
  .card .cta{margin-top:14px}
  .card .cta a{
    display:inline-block;font-family:var(--mono);font-size:.8rem;font-weight:600;text-decoration:none;
    color:var(--paper);background:var(--ink);border-radius:8px;padding:9px 16px;transition:background .15s ease
  }
  .card .cta a:hover{background:var(--excel)}
  .card .cta a.disabled{background:var(--grid);color:var(--muted);pointer-events:none}

  /* ===== Skills strip ===== */
  section.skills{padding:26px 0 10px}
  .skills h2, .about h2{font-size:.8rem;font-family:var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .skills .row{display:flex;flex-wrap:wrap;gap:8px}

  footer{padding:40px 0 60px;color:var(--muted);font-family:var(--mono);font-size:.75rem}
  footer .wrap{border-top:1px solid var(--grid);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
</style>
</head>

    c.skills.map(s => '<span class="chip">'+s+'</span>').join('');

  // Project cards
  const grid = document.getElementById('projectGrid');
  const toolMeta = {
    pbi:{label:'Power BI', cls:'pbi', cta:'report'},
    excel:{label:'Excel', cls:'excel', cta:'workbook'},
    sql:{label:'SQL', cls:'sql', cta:'project'},
    py:{label:'Python', cls:'py', cta:'project'}
  };

  grid.innerHTML = c.projects.map((p,i) => {
    const t = toolMeta[p.tool] || toolMeta.excel;
    let media;
    if (p.embedUrl) {
      media = '<iframe src="'+p.embedUrl+'" title="'+p.title+'" loading="lazy" allowfullscreen></iframe>';
    } else if (p.imageUrl) {
      media = '<img src="'+p.imageUrl+'" alt="Screenshot: '+p.title+'" loading="lazy">';
    } else {
      const icon = p.tool === 'pbi' ? '▦' : '⊞';
      media = '<div class="placeholder"><span class="icon">'+icon+'</span><span>Preview pending<br>(embed or screenshot)</span></div>';
    }
    const cta = p.link
      ? '<a href="'+p.link+'" target="_blank" rel="noopener">Open '+t.cta+' ↗</a>'
      : '<a class="disabled" aria-disabled="true">Available on request</a>';
    return (
      '<article class="card" data-tool="'+p.tool+'">' +
        '<div class="media">'+media+'</div>' +
        '<div class="body">' +
          '<div class="toolrow"><span class="badge '+t.cls+'">'+t.label+'</span><span class="org">'+p.org+'</span></div>' +
          '<h3>'+p.title+'</h3>' +
          '<p class="desc">'+p.desc+'</p>' +
          '<dl class="facts"><dt>Problem</dt><dd>'+p.problem+'</dd></dl>' +
          '<div class="chips">'+p.stack.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div>' +
          '<div class="cta">'+cta+'</div>' +
        '</div>' +
      '</article>'
    );
  }).join('');

  // Sheet-tab filtering
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
    const f = tab.dataset.filter;
    document.querySelectorAll('.card').forEach(card => {
      card.classList.toggle('hidden', f !== 'all' && card.dataset.tool !== f);
    });
    updateCellRef();
  }));

  // Formula-bar cell reference follows scroll (small delight, cheap)
  const ref = document.getElementById('cellref');
  function updateCellRef(){
    const row = Math.max(1, Math.round(window.scrollY / 32) + 1);
    ref.textContent = 'A' + row;
  }
  window.addEventListener('scroll', updateCellRef, {passive:true});
  updateCellRef();
})();
</script>
</body>
</html>
